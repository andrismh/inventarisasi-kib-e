{% extends "base.html" %}
{% block title %}Master Table — KIB-E{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Master Table</h1>
        <p class="text-slate-500 text-sm mt-1">Full editable inventory grid</p>
    </div>
    <div class="flex items-center gap-4">
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input id="filter" type="text" placeholder="Search all columns..."
                   class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm w-72 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all shadow-sm">
        </div>
        <div id="status" class="text-sm font-medium px-4 py-1.5 rounded-full bg-white text-slate-600 shadow-sm border border-slate-200"></div>
    </div>
</div>
<div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
    <div id="grid" class="w-full"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/master_table.js') }}"></script>
{% endblock %}
